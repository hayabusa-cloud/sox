name: Go
on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.25.x' ]

    steps:
      - uses: actions/checkout@v3
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v .
      - name: Test with the Go CLI
        run: go test -v .